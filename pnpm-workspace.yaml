allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true

overrides:
  devalue: ^5.9.1
  esbuild: 0.28.1
  # Security pins (see audit:deps): each entry is the first patched release.
  fast-uri: 4.2.3
  undici: 8.12.3
  source-map-js: 1.2.2
  smol-toml: 1.9.1
  zod: 4.6.7
  js-yaml: 4.3.2
  nanoid: 3.3.18
  svgo: 4.1.0
  volar-service-yaml: 0.0.71
  # Dedupe: hast-util-from-html-isomorphic (via rehype-katex) pins 3.0.4 while
  # Astro's chain uses 3.0.5. Two copies make hast.Root two distinct types, so
  # rehype-katex stops matching Astro's RehypePlugin and `astro check` fails.
  "@types/hast": 3.0.5
