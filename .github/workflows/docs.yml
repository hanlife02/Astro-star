name: Docs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-dispatch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: "docs/.nvmrc"
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Check formatting
        run: pnpm --ignore-workspace lint

      - name: Build
        run: pnpm --ignore-workspace docs:build

      - name: Trigger GitHub Pages deployment
        if: >-
          github.repository == 'hanlife02/Astro-star' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$ACTIONS_PAT" ]; then
            echo "::error::Missing ACTIONS_PAT secret required to trigger Astro-star-docs deployment."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/hanlife02/Astro-star-docs/actions/workflows/deploy.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${ACTIONS_PAT}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"main\",\"inputs\":{\"source_sha\":\"${SOURCE_SHA}\"}}"
