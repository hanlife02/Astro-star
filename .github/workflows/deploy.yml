name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, Ethan]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
  SSH_PORT: ${{ vars.SSH_PORT || '22' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/Astro-star' }}
  PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'Astro-star' }}
  APP_PORT: ${{ vars.APP_PORT || '4321' }}

jobs:
  deploy:
    if: >-
      (github.repository == 'hanlife02/Astro-star' && github.ref_name == 'Ethan') ||
      (github.repository != 'hanlife02/Astro-star' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PAT || github.token }}

      # ── Source hash: skip build if nothing changed ──
      - name: Compute source hash
        id: hash
        run: |
          HASH=${{ hashFiles('src/**', 'scripts/**', 'public/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.nvmrc', 'astro.config.mjs', '.github/workflows/deploy.yml', 'ecosystem.config.cjs', 'server-start.mjs') }}
          echo "source_hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Check hash cache
        # Manual deployments also apply updates to repository secrets and variables.
        if: github.event_name != 'workflow_dispatch'
        id: cache
        uses: actions/cache@v5
        with:
          path: .hash-marker
          key: deploy-hash-${{ steps.hash.outputs.source_hash }}

      - name: Skip notice
        if: steps.cache.outputs.cache-hit == 'true'
        run: echo "Source unchanged — skipping build & deploy."

      # ── Build ──
      - name: Setup Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Setup pnpm
        if: steps.cache.outputs.cache-hit != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          WALINE_SERVER_URL: ${{ secrets.WALINE_SERVER_URL || secrets.PUBLIC_WALINE_SERVER_URL || vars.WALINE_SERVER_URL || vars.PUBLIC_WALINE_SERVER_URL }}
          PUBLIC_WALINE_SERVER_URL: ${{ secrets.PUBLIC_WALINE_SERVER_URL || secrets.WALINE_SERVER_URL || vars.PUBLIC_WALINE_SERVER_URL || vars.WALINE_SERVER_URL }}
          CODETIME_TOKEN: ${{ secrets.CODETIME_TOKEN }}
        run: pnpm build

      - name: Sync Algolia index
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_WRITE_API_KEY }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        run: pnpm run algolia:sync

      # ── Deploy via rsync + SSH ──
      - name: Setup SSH
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_HOST and SSH_PRIVATE_KEY secrets are required for deployment."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Unable to collect the SSH host key for the configured SSH_HOST on port ${SSH_PORT}."
            exit 1
          fi

      # Ship hashed assets first, additively. Everything under _astro/ carries a
      # content hash in its filename, so an existing name is byte-identical and
      # can be skipped outright — no checksums, no re-transfer. Landing these
      # before any HTML moves means the markup swapped in below never points at
      # a file that is still uploading; a single-pass rsync once served new HTML
      # for 13 minutes while its script bundle was still in flight, leaving the
      # page without any of its client behaviour.
      - name: Rsync hashed assets to server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rsync -a --ignore-existing \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }}" \
            dist/client/_astro/ \
            ${{ env.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/client/_astro/

      # Reconcile everything else and drop what the new build no longer ships.
      # --checksum stays: a fresh CI build rewrites every mtime, so the default
      # size+time comparison would re-upload the whole tree each deploy.
      - name: Rsync to server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rsync -a --checksum --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.subscriptions' \
            --exclude='.env.subscriptions.json' \
            --exclude='/.subscriptions/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }}" \
            dist/ package.json pnpm-lock.yaml pnpm-workspace.yaml .nvmrc ecosystem.config.cjs server-start.mjs \
            ${{ env.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy runtime env vars
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          {
            echo "WALINE_SERVER_URL=${{ secrets.WALINE_SERVER_URL || secrets.PUBLIC_WALINE_SERVER_URL || vars.WALINE_SERVER_URL || vars.PUBLIC_WALINE_SERVER_URL }}"
            echo "PUBLIC_WALINE_SERVER_URL=${{ secrets.PUBLIC_WALINE_SERVER_URL || secrets.WALINE_SERVER_URL || vars.PUBLIC_WALINE_SERVER_URL || vars.WALINE_SERVER_URL }}"
            echo "GH_TOKEN=${{ secrets.GH_TOKEN }}"
            echo "CODETIME_TOKEN=${{ secrets.CODETIME_TOKEN }}"
          } | \
            ssh -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }} \
              ${{ env.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "cat > ${{ env.DEPLOY_PATH }}/.env"

      - name: Deploy subscription settings
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SUBSCRIPTIONS_BARK: ${{ vars.SUBSCRIPTIONS_BARK }}
          SUBSCRIPTIONS_DB_PATH: ${{ vars.SUBSCRIPTIONS_DB_PATH }}
          SUBSCRIPTIONS_SMTP_HOST: ${{ vars.SUBSCRIPTIONS_SMTP_HOST }}
          SUBSCRIPTIONS_SMTP_PORT: ${{ vars.SUBSCRIPTIONS_SMTP_PORT }}
          SUBSCRIPTIONS_SMTP_FROM: ${{ vars.SUBSCRIPTIONS_SMTP_FROM }}
          SUBSCRIPTIONS_SMTP_USER: ${{ vars.SUBSCRIPTIONS_SMTP_USER || secrets.SUBSCRIPTIONS_SMTP_USER }}
          SUBSCRIPTIONS_SMTP_PASSWORD: ${{ secrets.SUBSCRIPTIONS_SMTP_PASSWORD }}
          SUBSCRIPTIONS_TELEGRAM_BOT_USERNAME: ${{ vars.SUBSCRIPTIONS_TELEGRAM_BOT_USERNAME }}
          SUBSCRIPTIONS_TELEGRAM_BOT_TOKEN: ${{ secrets.SUBSCRIPTIONS_TELEGRAM_BOT_TOKEN }}
          SUBSCRIPTIONS_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.SUBSCRIPTIONS_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -o pipefail
          node -e '
            const settings = Object.fromEntries(
              Object.entries(process.env).filter(([key, value]) => key.startsWith("SUBSCRIPTIONS_") && value !== "")
            );
            process.stdout.write(JSON.stringify(settings));
          ' | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
            set -e
            umask 077
            cd $DEPLOY_PATH
            tmp=\$(mktemp .env.subscriptions.json.XXXXXX)
            trap 'rm -f -- \"\$tmp\"' EXIT
            cat > \"\$tmp\"
            python3 -m json.tool \"\$tmp\" > /dev/null
            mv -f -- \"\$tmp\" .env.subscriptions.json"

      - name: Install & restart on server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SSH_PORT }} \
            ${{ env.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "source ~/.nvm/nvm.sh 2>/dev/null || true
            source ~/.bashrc 2>/dev/null || true
            set -e
            cd ${{ env.DEPLOY_PATH }}
            pm2_bin=\$(command -v pm2)
            if [ \"\$(node --version)\" != \"v\$(cat .nvmrc)\" ]; then
              nvm install
            fi
            pnpm_package=\$(node -p 'require(\"./package.json\").packageManager')
            CI=true npm exec --yes --package=\"\$pnpm_package\" -- pnpm install --prod --frozen-lockfile
            \"\$pm2_bin\" delete ${{ env.PM2_APP_NAME }} 2>/dev/null || true
            ASTRO_STAR_NODE=\"\$(command -v node)\" PM2_APP_NAME=${{ env.PM2_APP_NAME }} PORT=${{ env.APP_PORT }} \"\$pm2_bin\" start ecosystem.config.cjs
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 --max-time 8 http://localhost:${{ env.APP_PORT }}/subscribe/ > /dev/null
            \"\$pm2_bin\" save"

      - name: Cleanup SSH
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -f ~/.ssh/deploy_key

      # ── Save hash marker on success ──
      - name: Save hash marker
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.hash.outputs.source_hash }}" > .hash-marker
